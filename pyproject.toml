[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiger-cli"
version = "0.1.0"
description = "Tiger Framework - Command-line based full-stack meta-framework"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Tiger Framework Team" }
]
dependencies = [
    "typer>=0.9.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
tiger = "main:app"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*"]

[tool.setuptools.package-data]
"core" = ["assets/*"]

