name: "🐛 Bug Report"
description: File a bug report to help us improve Tiger Framework
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Tiger CLI Version
      description: What version of tiger-cli are you running? (Run 	iger --version)
      placeholder: "tiger-cli 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL/Arch)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you were trying to do and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'tiger create-app demo'
        2. Select 'FastAPI' and 'PostgreSQL'
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Stack Trace
      description: Please paste any relevant error output or run with 	iger doctor.
      render: shell
