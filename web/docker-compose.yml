version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tiger-framework-web-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tiger_framework_web
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiger-framework-web-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tiger-framework-web-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  mysqldata:
